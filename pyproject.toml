[project]
name = "logseek"
version = "0.1.0"
description = "Search huge time-sorted log files in milliseconds with binary search on disk"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["logseek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
