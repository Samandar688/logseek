[project]
name = "logseek"
version = "0.1.0"
description = "Search huge time-sorted log files in milliseconds with binary search on disk"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
logseek = "logseek.cli:main"
logseek-web = "logseek.web:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["logseek"]

[tool.setuptools.package-data]
logseek = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
